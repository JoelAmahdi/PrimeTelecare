# ========================================================
# Google Cloud Build — Automated Cloud Run Deployment
# ========================================================
steps:
  # 1. Build Production Multi-Stage Docker Container
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/prime-telecare:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/prime-telecare:latest'
      - '.'

  # 2. Push Container to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/prime-telecare:$COMMIT_SHA'

  # 3. Deploy to Google Cloud Run (Serverless, Auto-Scaling)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'prime-telecare'
      - '--image'
      - 'gcr.io/$PROJECT_ID/prime-telecare:$COMMIT_SHA'
      - '--region'
      - 'europe-west1' # Close to West Africa routing
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '5000'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'NODE_ENV=production'

images:
  - 'gcr.io/$PROJECT_ID/prime-telecare:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/prime-telecare:latest'

options:
  logging: CLOUD_LOGGING_ONLY

