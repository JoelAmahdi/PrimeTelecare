name: Prime Telecare CI/CD & Production Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-and-test:
    name: Build, Lint & Automated Clinical Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript Compilation & Frontend Build
        run: npm run build

      - name: Run Backend API Test Suite (14 Endpoints)
        run: npm run test:api
        env:
          NODE_ENV: test
          PORT: 5099

      - name: Run Full-Stack Clinical E2E Test Suite (17 Steps)
        run: npm run test:e2e
        env:
          NODE_ENV: test
          PORT: 5099

