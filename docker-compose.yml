version: '3.8'

services:
  prime-telecare-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prime-telecare-app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - prime-store-data:/app/server/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  prime-store-data:
    driver: local

